name: Build Swock for Windows

on:
  push:
    branches: [main, master, windows-vpn-client]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Generate Windows Flutter runner
        run: flutter create --platforms=windows --project-name swock .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Windows VPN core
        working-directory: windows/core
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          go mod tidy
          $goFiles = Get-ChildItem internal/tunnel -Filter '*.go' | ForEach-Object FullName
          gofmt -w cmd/swock_core/main_windows.go $goFiles
          go test ./...
          go build -trimpath -ldflags="-s -w" -o build/swock_core.exe ./cmd/swock_core

      - name: Download and verify Wintun
        shell: pwsh
        run: |
          $url = 'https://www.wintun.net/builds/wintun-0.14.1.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') {
            throw "Wintun archive checksum mismatch: $hash"
          }
          $target = Join-Path $env:RUNNER_TEMP 'wintun'
          Expand-Archive -Path $zip -DestinationPath $target -Force
          $dll = Join-Path $target 'wintun/bin/amd64/wintun.dll'
          if (-not (Test-Path $dll)) { throw 'The verified Wintun package did not contain the x64 runtime DLL.' }
          Copy-Item $dll 'windows/core/build/wintun.dll'
          $license = Get-ChildItem $target -Recurse -File | Where-Object Name -Match '^LICENSE' | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName 'windows/core/build/ThirdParty-Wintun-LICENSE.txt' }

      - name: Download and verify Xray and Sing-box runtimes
        shell: pwsh
        run: |
          $runtimeRoot = 'windows/core/build/runtime'
          $xrayDir = Join-Path $runtimeRoot 'xray'
          $singBoxDir = Join-Path $runtimeRoot 'sing-box'
          New-Item -ItemType Directory -Path $xrayDir, $singBoxDir -Force | Out-Null

          $xrayZip = Join-Path $env:RUNNER_TEMP 'xray-windows-amd64.zip'
          Invoke-WebRequest -Uri 'https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-windows-64.zip' -OutFile $xrayZip
          $xrayHash = (Get-FileHash $xrayZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($xrayHash -ne '1262522266337b824f07beb8e1375786b437683b3890105469088f8e17e0a69d') {
            throw "Xray archive checksum mismatch: $xrayHash"
          }
          $xrayExtract = Join-Path $env:RUNNER_TEMP 'xray-runtime'
          Expand-Archive -Path $xrayZip -DestinationPath $xrayExtract -Force
          $xrayExe = Get-ChildItem $xrayExtract -Recurse -File | Where-Object Name -EQ 'xray.exe' | Select-Object -First 1
          if (-not $xrayExe) { throw 'The verified Xray package did not contain xray.exe.' }
          Copy-Item (Join-Path $xrayExe.DirectoryName '*') $xrayDir -Recurse -Force
          Copy-Item 'android/app/libs/LICENSE-Xray-core.txt' (Join-Path $xrayDir 'ThirdParty-Xray-core-LICENSE.txt')

          $singBoxZip = Join-Path $env:RUNNER_TEMP 'sing-box-windows-amd64.zip'
          Invoke-WebRequest -Uri 'https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip' -OutFile $singBoxZip
          $singBoxHash = (Get-FileHash $singBoxZip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($singBoxHash -ne '99185d75d314a07dbba4a130c8ad986cbeb629a07927975636b341ca61f991df') {
            throw "Sing-box archive checksum mismatch: $singBoxHash"
          }
          $singBoxExtract = Join-Path $env:RUNNER_TEMP 'sing-box-runtime'
          Expand-Archive -Path $singBoxZip -DestinationPath $singBoxExtract -Force
          $singBoxExe = Get-ChildItem $singBoxExtract -Recurse -File | Where-Object Name -EQ 'sing-box.exe' | Select-Object -First 1
          if (-not $singBoxExe) { throw 'The verified Sing-box package did not contain sing-box.exe.' }
          Copy-Item (Join-Path $singBoxExe.DirectoryName '*') $singBoxDir -Recurse -Force
          Copy-Item 'android/app/libs/LICENSE-libbox.txt' (Join-Path $singBoxDir 'ThirdParty-Sing-box-LICENSE.txt')

          $wintun = 'windows/core/build/wintun.dll'
          if (-not (Test-Path $wintun)) { throw 'The verified Wintun DLL is missing.' }
          Copy-Item $wintun (Join-Path $singBoxDir 'wintun.dll') -Force
          & (Join-Path $xrayDir 'xray.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged Xray runtime failed its version check.' }
          & (Join-Path $singBoxDir 'sing-box.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'The packaged Sing-box runtime failed its version check.' }
          $bridgeConfig = @{
            log = @{ level = 'info' }
            inbounds = @(@{
              type = 'tun'
              tag = 'swock-tun'
              interface_name = 'Swock VPN'
              address = @('172.19.0.1/30', 'fdfe:dcba:9876::1/126')
              auto_route = $false
              strict_route = $false
              dns_mode = 'disabled'
            })
            outbounds = @(@{
              type = 'socks'
              tag = 'xray'
              server = '127.0.0.1'
              server_port = 12345
              version = '5'
            })
            route = @{ final = 'xray' }
          } | ConvertTo-Json -Depth 10
          $bridgeConfigPath = Join-Path $env:RUNNER_TEMP 'swock-sing-box-check.json'
          Set-Content -Path $bridgeConfigPath -Value $bridgeConfig -Encoding ascii
          & (Join-Path $singBoxDir 'sing-box.exe') check -c $bridgeConfigPath
          if ($LASTEXITCODE -ne 0) { throw 'The generated Windows TUN/SOCKS bridge configuration is invalid.' }

      - name: Build Flutter Windows release
        run: flutter build windows --release

      - name: Assemble application bundle
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $release)) { $release = 'build/windows/runner/Release' }
          if (-not (Test-Path $release)) { throw 'Flutter Windows release output was not found.' }
          Copy-Item 'windows/core/build/swock_core.exe' $release
          Copy-Item 'windows/core/build/wintun.dll' $release
          $runtimeRelease = Join-Path $release 'runtime'
          New-Item -ItemType Directory -Path $runtimeRelease -Force | Out-Null
          Copy-Item 'windows/core/build/runtime/*' $runtimeRelease -Recurse -Force
          if (Test-Path 'windows/core/build/ThirdParty-Wintun-LICENSE.txt') {
            Copy-Item 'windows/core/build/ThirdParty-Wintun-LICENSE.txt' $release
          }
          $appExe = Get-ChildItem $release -Filter '*.exe' | Where-Object Name -ne 'swock_core.exe' | Select-Object -First 1
          if (-not $appExe) { throw 'Flutter application executable was not found.' }
          if ($appExe.Name -ne 'Swock.exe') { Rename-Item $appExe.FullName 'Swock.exe' }
          New-Item -ItemType Directory -Path 'build/windows/installer' -Force | Out-Null
          Copy-Item "$release/*" 'build/windows/installer/' -Recurse -Force

      - name: Build installable setup and uninstaller
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $isccPath = @(
            'C:/Program Files (x86)/Inno Setup 6/ISCC.exe',
            'C:/Program Files/Inno Setup 6/ISCC.exe',
            "$env:ChocolateyInstall/lib/innosetup/tools/ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $isccPath) { throw 'Inno Setup compiler was not installed in its expected location.' }
          $bundleDir = (Resolve-Path 'build/windows/installer').Path
          $outputDir = Join-Path $PWD 'build/windows/output'
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          & $isccPath "/DBundleDir=$bundleDir" "/DOutputDir=$outputDir" 'windows/installer/Swock.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Swock-Windows-Installer
          path: build/windows/output/Swock-Setup.exe
          if-no-files-found: error

