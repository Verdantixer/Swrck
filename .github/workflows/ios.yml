name: Build Release iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release IPA Archive
        run: flutter build ipa --release --no-codesign

      - name: Package Release Payload to IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/ || cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r Swock-Release.ipa Payload
          cd ../../..

      - name: Upload Release IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swock-Release-IPA
          path: build/ios/ipa/Swock-Release.ipa

      - name: Upload Xcode Release Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swock-Release-XCArchive
          path: build/ios/archive/Runner.xcarchive
