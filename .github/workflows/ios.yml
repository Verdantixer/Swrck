name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure iOS project
        run: flutter build ios --release --no-codesign --config-only

      - name: Build unsigned iOS app
        run: >-
          xcodebuild
          -workspace ios/Runner.xcworkspace
          -scheme Runner
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/ios/DerivedData
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_IDENTITY=
          build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="build/ios/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          mkdir -p build/ios/ipa/Payload
          ditto "$app" build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          /usr/bin/zip -qry Swock-Unsigned.ipa Payload

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Swock-Unsigned-IPA
          path: build/ios/ipa/Swock-Unsigned.ipa
